project:
  title: "Mario goes ASIC"
  author: "Calin"
  discord: ""
  description: "Scrolling VGA platformer with QSPI assets, movement lookup and integrated flash progress bar"
  language: "Verilog"
  clock_hz: 25200000
  tiles: "1x1"
  top_module: "tt_um_mario_levels"
  source_files:
    - "tt_um_mario_levels.v"
    - "controls.v"
pinout:
  ui[0]: "Level select bit 0 (DIP 0)"
  ui[1]: "Level select bit 1 (DIP 1)"
  ui[2]: "Level select bit 2 (DIP 2)"
  ui[3]: "Load/hold selected level (DIP 3), active high"
  ui[4]: "Gamepad latch"
  ui[5]: "Gamepad serial clock"
  ui[6]: "Gamepad serial data"
  ui[7]: ""
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"
  uio[0]: "Flash CS, active low"
  uio[1]: "QSPI IO0"
  uio[2]: "QSPI IO1"
  uio[3]: "QSPI clock"
  uio[4]: "QSPI IO2"
  uio[5]: "QSPI IO3"
  uio[6]: "PSRAM A CS, held high"
  uio[7]: "Jump audio PWM (Audio PMOD isolates PSRAM B CS)"
yaml_version: 6
